name: Build Test APK (v10.2)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-test-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Remove stale legacy Java sources
        run: rm -rf app/src/main/java/com/phrasecards
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          grep -Eq 'versionCode[[:space:]]+50' app/build.gradle
          grep -q 'applicationId "com.zopelab.zopeflashcards"' app/build.gradle
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ZopeFlashCards-v10.2-code50-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
