name: Build Google Play AAB
on: { workflow_dispatch: {}, push: { branches: [ main ] } }
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: { distribution: temurin, java-version: '17' }
   - uses: gradle/actions/setup-gradle@v4
     with: { gradle-version: '8.9' }
   - name: Remove stale legacy Java sources
     run: |
       rm -rf app/src/main/java/com/phrasecards
   - name: Verify Play package consistency
     run: |
       ! grep -R "^package com.phrasecards" app/src/main/java --include='*.java'
       grep -R "^package com.zopelab.zopeflashcards;" app/src/main/java --include='*.java'
       grep -q 'applicationId "com.zopelab.zopeflashcards"' app/build.gradle
   - name: Build signed release AAB
     run: gradle clean bundleRelease --stacktrace
   
      - name: Verify built AAB version and package
        run: |
          python3 - <<'PY'
          import re
          import zipfile
          from pathlib import Path

          gradle = Path("app/build.gradle").read_text()
          aab = Path("app/build/outputs/bundle/release/app-release.aab")

          assert re.search(r'versionCode\s+49\b', gradle), "Expected versionCode 49"
          assert re.search(r'versionName\s+"10\.1"', gradle), "Expected versionName 10.1"
          assert 'com.zopelab.zopeflashcards' in gradle, "Incorrect application ID"
          assert aab.exists(), "Release AAB not found"

          with zipfile.ZipFile(aab) as bundle:
              assert bundle.testzip() is None, "AAB archive is corrupt"
              assert "base/manifest/AndroidManifest.xml" in bundle.namelist(), "Missing manifest"

          print("AAB archive validation passed.")
          PY
   - name: Upload Google Play bundle
     uses: actions/upload-artifact@v4
     with:
      name: ZopeFlashCards-v10.1-code49-GooglePlay-AAB
      path: app/build/outputs/bundle/release/app-release.aab
      if-no-files-found: error
