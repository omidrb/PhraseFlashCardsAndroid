name: Build Android Release
on: { workflow_dispatch: {}, push: { branches: [ main ] } }
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: { distribution: temurin, java-version: '17' }
   - uses: gradle/actions/setup-gradle@v4
     with: { gradle-version: '8.9' }
   - run: gradle bundleRelease assembleRelease
   - uses: actions/upload-artifact@v4
     with: { name: ZopeFlashCards-v9.8-Play-Release, path: app/build/outputs/bundle/release/app-release.aab }
   - uses: actions/upload-artifact@v4
     with: { name: ZopeFlashCards-v9.8-Release-APK, path: app/build/outputs/apk/release/app-release.apk }
