name: Build Google Play AAB
on: { workflow_dispatch: {}, push: { branches: [ main ] } }
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: { distribution: temurin, java-version: '17' }
   - uses: gradle/actions/setup-gradle@v4
     with: { gradle-version: '8.9' }
   - name: Remove stale legacy Java sources
     run: |
       rm -rf app/src/main/java/com/phrasecards
   - name: Verify Play package consistency
     run: |
       ! grep -R "^package com.phrasecards" app/src/main/java --include='*.java'
       grep -R "^package com.zopelab.zopeflashcards;" app/src/main/java --include='*.java'
       grep -q 'applicationId "com.zopelab.zopeflashcards"' app/build.gradle
   - name: Build signed release AAB
     run: gradle clean bundleRelease --stacktrace
   - name: Inspect built AAB (diagnostic only)
     run: |
       AAB=app/build/outputs/bundle/release/app-release.aab
       if [ ! -s "$AAB" ]; then
         echo "ERROR: AAB is missing or empty"
         exit 1
       fi
       echo "AAB exists: $(ls -lh "$AAB")"
       echo "Expected app versionCode: 52"
       echo "Expected applicationId: com.zopelab.zopeflashcards"
       grep -qE 'versionCode[[:space:]]+52([;[:space:]]|$)' app/build.gradle || { echo "ERROR: Gradle versionCode is not 52"; exit 1; }
       grep -q 'applicationId "com.zopelab.zopeflashcards"' app/build.gradle || { echo "ERROR: Unexpected applicationId"; exit 1; }
       echo "AAB presence and Gradle configuration verified. Play Console will validate the uploaded bundle."
   - name: Build debug APK for phone testing
     run: gradle assembleDebug --stacktrace
   - name: Upload debug APK
     uses: actions/upload-artifact@v4
     with:
      name: ZopeFlashCards-v10.3-code52-Test-APK
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
   - name: Upload Google Play bundle
     uses: actions/upload-artifact@v4
     with:
      name: ZopeFlashCards-v10.3-code52-GooglePlay-AAB
      path: app/build/outputs/bundle/release/app-release.aab
      if-no-files-found: error
