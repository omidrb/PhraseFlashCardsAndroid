name: Build Google Play AAB
on: { workflow_dispatch: {}, push: { branches: [ main ] } }
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: { distribution: temurin, java-version: '17' }
   - uses: gradle/actions/setup-gradle@v4
     with: { gradle-version: '8.9' }
   - name: Remove stale legacy Java sources
     run: |
       rm -rf app/src/main/java/com/phrasecards
   - name: Verify Play package consistency
     run: |
       ! grep -R "^package com.phrasecards" app/src/main/java --include='*.java'
       grep -R "^package com.zopelab.zopeflashcards;" app/src/main/java --include='*.java'
       grep -q 'applicationId "com.zopelab.zopeflashcards"' app/build.gradle
   - name: Build signed release AAB
     run: gradle clean bundleRelease --stacktrace
   - name: Verify built AAB version and package
     run: |
       curl --fail --location --retry 3 --output /tmp/bundletool.jar https://repo1.maven.org/maven2/com/android/tools/build/bundletool/1.18.2/bundletool-1.18.2.jar
       AAB=app/build/outputs/bundle/release/app-release.aab
       test -s "$AAB"
       CODE=$(java -jar /tmp/bundletool.jar dump manifest --bundle="$AAB" --xpath=/manifest/@android:versionCode)
       PACKAGE=$(java -jar /tmp/bundletool.jar dump manifest --bundle="$AAB" --xpath=/manifest/@package)
       echo "AAB versionCode: $CODE; package: $PACKAGE"
       test "$CODE" = "49"
       test "$PACKAGE" = "com.zopelab.zopeflashcards"
   - name: Upload Google Play bundle
     uses: actions/upload-artifact@v4
     with:
      name: ZopeFlashCards-v10.1-code49-GooglePlay-AAB
      path: app/build/outputs/bundle/release/app-release.aab
      if-no-files-found: error
