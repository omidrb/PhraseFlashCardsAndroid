name: Build Android APK
on: { workflow_dispatch: {}, push: { branches: [ main ] } }
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: { distribution: temurin, java-version: '17' }
   - uses: gradle/actions/setup-gradle@v4
     with: { gradle-version: '8.9' }
   - name: Remove stale legacy Java sources
     run: |
       rm -rf app/src/main/java/com/zopelab
       rm -rf app/src/main/java/com/zopelab/zopeflashcards
   - name: Verify package consistency
     run: |
       ! grep -R "^package com.zopelab" app/src/main/java --include='*.java'
       grep -R "^package com.phrasecards.app;" app/src/main/java --include='*.java'
   - run: gradle clean assembleDebug --stacktrace
   - uses: actions/upload-artifact@v4
     with: { name: ZopeFlashCards-v9.9-fixed-APK, path: app/build/outputs/apk/debug/app-debug.apk }
